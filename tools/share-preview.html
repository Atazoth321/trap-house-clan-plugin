<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>TRAP HOUSE — Interactive Sample Preview</title>
<style>
:root{color-scheme:dark;font:14px Arial,sans-serif;color:#eff1f6;background:#0f1116;--muted:#8f97a7;--red:#ff4d5b;--card:#181b22;--border:#2b2f39}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit;background:#21252e;border:1px solid var(--border);border-radius:8px;padding:9px}button{cursor:pointer}button:hover{border-color:var(--red)}button:focus-visible{outline:2px solid var(--red);outline-offset:2px}button:disabled{opacity:.4;cursor:default}h1,h2,h3,p{margin:0 0 12px}h1{font-size:22px}h2{font-size:18px}h3{font-size:12px}small,.muted{color:var(--muted)}.notice{padding:14px 20px;border-bottom:1px solid var(--border);color:#ffb1b8;background:#24151c}.layout{display:grid;grid-template-columns:290px 1fr;gap:24px;max-width:1350px;margin:24px auto;padding:0 16px}.brand{background:linear-gradient(120deg,#551b28,#1d1822);border-color:#78303d!important}.brand img{width:46px;height:46px;float:left;margin-right:10px}.card{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.accent{color:var(--red)}.green{color:#79ca98}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{text-align:center;padding:14px 5px;background:var(--card)}.tile strong{display:block;color:var(--red);margin-bottom:5px}.tile small{font-size:11px}nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 24px}nav button{border-radius:24px;font-size:12px}nav button.selected{background:#852333}.emblem{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px;image-rendering:pixelated}progress{width:100%;height:7px;accent-color:var(--red);margin-top:12px}details{margin-top:10px}summary{cursor:pointer;color:var(--red);padding:8px}main{min-width:0}main .card{max-width:940px}.members{width:100%;text-align:left;margin-bottom:6px;padding:14px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.goal{padding:8px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border)}.goal span:last-child{white-space:nowrap}.list{display:grid;gap:8px}.staff{color:var(--muted);font-size:12px}dialog{width:min(1000px,96vw);max-height:90vh;border:1px solid var(--border);border-radius:14px;background:#0f1116;color:#eff1f6;padding:20px}dialog::backdrop{background:#000b}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.filters input[type=search]{flex:1;min-width:150px}.paging{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:14px}.award-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.award{min-height:175px;display:flex;flex-direction:column;margin:0}.award img{width:48px;height:42px;object-fit:contain;image-rendering:pixelated;margin:12px auto}.award .badge{font-size:30px;margin:10px auto;color:var(--red)}.award strong{font-size:12px;overflow-wrap:anywhere}.award small{font-size:11px;margin-top:6px}.award .points{margin-top:auto;padding-top:12px}.help{font-size:13px;line-height:1.6}.top{margin-bottom:20px}#board-search{width:100%;margin-bottom:12px}@media(max-width:760px){.layout{grid-template-columns:1fr;margin-top:14px}aside{max-width:none}.columns{grid-template-columns:1fr}.award-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.paging{flex-wrap:wrap}nav{grid-template-columns:repeat(3,1fr)}}
</style>
<div class="notice"><strong>TRAP HOUSE · INTERACTIVE SAMPLE</strong> — Offline preview of the plugin design. All members, awards, points, and schedules are sample data.</div>
<div class="layout"><aside><div class="card brand"><img id="logo" alt="TRAP HOUSE logo"><small>THE CLAN / THE GRIND</small><h1>TRAP HOUSE.</h1><small>PvM. Skill. TRAP.</small></div><nav id="nav"></nav><div id="sidebar"></div></aside><main id="main"></main></div>
<dialog id="log"><div class="row"><h2 id="log-title"></h2><button id="close-log" aria-label="Close points log">✕ Close</button></div><small>Sample allocations · Real OSRS item artwork · Dates in UTC</small><div class="filters"><label>Source <select id="source"></select></label><label>Sort <select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="highest">Highest points</option></select></label><input type="search" id="search" aria-label="Search awards" placeholder="Search awards…"><label><input type="checkbox" id="group"> Group</label></div><div class="paging"><span id="totals"></span><button id="prev">Prev</button><span id="page"></span><button id="next">Next</button></div><div id="awards" class="award-grid"></div></dialog>
<script id="fixture" type="application/json">__FIXTURE__</script>
<script id="assets" type="application/json">__ASSETS__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('fixture').textContent),assets=JSON.parse(document.getElementById('assets').textContent);
const $=id=>document.getElementById(id),num=n=>Number(n).toLocaleString('en-US'),categories=['Drops','Pets','Milestones','Diaries','Challenges','Events','Combat','Collection','Misc'];
const tabs=['Profile','Ranks','Leaderboard','Achievements','Events','Diary','Competitions'];let member=data.profile,tab='Profile',page=1,filtered=[];
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function card(title,parent){const c=el('section',undefined,'card');if(title)c.append(el('h3',title));parent.append(c);return c;}
function button(text,action,cls){const b=el('button',text,cls);b.type='button';b.onclick=action;return b;}
function rank(name,title){const r=el('span');const key=name.toLowerCase().replaceAll(' ','-');if(assets['ranks/'+key]){const i=el('img');i.src=assets['ranks/'+key];i.alt=name+' emblem';i.className='emblem';r.append(i);}r.append(document.createTextNode(title||name));return r;}
function line(parent,left,right){const row=el('div',undefined,'goal');row.append(el('span',left),el('span',right,'accent'));parent.append(row);}
function selectMember(row){member=row.name===data.profile.name?data.profile:{...row,automaticRank:row.rank,assignedRank:null,breakdown:{Misc:row.points},earnedRankHistory:[],metrics:{},promotionEligible:false};show('Profile');}
function profile(parent,compact){
 const hero=card(null,parent),r=el('div',undefined,'row');r.append(rank(member.rank,member.name),el('strong',num(member.points)+' pts','accent'));hero.append(r);
 const next=data.ranks.find(x=>x.threshold>member.points);hero.append(el('p',next?num(next.threshold-member.points)+' pts to '+next.name:'Highest earned tier','accent'));
 const progress=el('progress');progress.max=next?next.threshold:Math.max(member.points,1);progress.value=member.points;progress.setAttribute('aria-label','Points toward next rank');hero.append(progress);
 parent.append(el('h3','Points from:','accent'));const grid=el('div',undefined,'grid');for(const category of categories){const b=button('',()=>openLog(category),'tile');b.append(el('strong',num(member.breakdown[category]||0)),el('small',category));b.setAttribute('aria-label',category+' points log');grid.append(b);}parent.append(grid);
 const metrics=card(null,parent);line(metrics,'EHP',member.metrics?.ehp?num(member.metrics.ehp):'Not synced');line(metrics,'EHB',member.metrics?.ehb?num(member.metrics.ehb):'Not synced');
 const details=el('details'),summary=el('summary','Rank details & history');details.append(summary);const d=card(null,details);line(d,'Automatic rank',member.automaticRank||member.rank);line(d,'Assigned rank',member.assignedRank||'None');line(d,'Promotion eligibility',member.promotionEligible?'Eligible':'No pending promotion');line(d,'Lifetime earned',num(member.lifetimeEarnedPoints??member.points));line(d,'Balance rank',member.balanceRank||member.rank);line(d,'Rank lock',member.rankLocked?'Locked':'Unlocked');line(d,'Leadership protection',member.protectedRank?'Protected':'No');for(const tier of member.earnedRankHistory||[])line(d,tier.rank,num(tier.threshold)+' pts earned');parent.append(details);
 if(!compact){goals(parent,['Milestones','Combat']);const awards=card('RECENT AWARDS',parent);if(member.name===data.profile.name)for(const h of data.history)line(awards,h.key,'+'+h.points+' pts');else awards.append(el('p','No sample awards recorded.','muted'));}
}
function goals(parent,allowed){const g=card('ACHIEVEMENTS & PROGRESS',parent);for(const goal of data.goals.filter(g=>allowed.includes(g.category)))line(g,(member.name===data.profile.name&&goal.completed?'✓ ':'□ ')+goal.name,'+'+goal.points+' pts');}
function show(selected){tab=selected;$('main').replaceChildren();$('sidebar').replaceChildren();for(const b of $('nav').children)b.classList.toggle('selected',b.textContent===tab);profile($('sidebar'),true);const main=$('main');main.append(el('h2',tab,'top'));
 if(tab==='Profile'){main.append(el('p','Click a points tile to explore item awards. Choose a leaderboard member to view their profile.','muted'));profile(main,false);}
 if(tab==='Ranks'){const columns=el('div',undefined,'columns');main.append(columns);const earned=card('PROGRESSION',columns);for(const r of data.ranks){const row=el('div',undefined,'goal');row.append(rank(r.name),el('span',num(r.threshold)+' pts','accent'));earned.append(row);}const staff=card('PROTECTED MANAGEMENT / STAFF',columns);for(const r of data.protectedRanks){const row=el('div',undefined,'goal');row.append(rank(r.name),el('span','Owner control','staff'));staff.append(row);}staff.append(el('p','Staff titles are separate from service permissions.','muted'));}
 if(tab==='Leaderboard'){const search=el('input');search.id='board-search';search.type='search';search.placeholder='Search members…';search.setAttribute('aria-label','Search members');main.append(search);const rows=el('div');main.append(rows);function render(){rows.replaceChildren();data.leaderboard.forEach((m,i)=>{if(!m.name.toLowerCase().includes(search.value.toLowerCase()))return;const b=button('',()=>selectMember(m),'members row');b.append(rank(m.rank,'#'+(i+1)+'  '+m.name),el('strong',num(m.points)+' pts','accent'));rows.append(b);});}search.oninput=render;render();}
 if(tab==='Achievements')goals(main,['Milestones','Combat','Collection','Challenges']);
 if(tab==='Diary')goals(main,['Diaries']);
 if(tab==='Events')for(const event of data.clanEvents){const c=card(event.title,main);c.append(el('p',event.description),el('p',event.startsAt,'muted'),el('p',event.registrations+' sample registrations'));c.append(el('small','Preview only — registration is available in the connected plugin.'));}
 if(tab==='Competitions')for(const race of data.races){const c=card(race.title,main);c.append(el('p',race.description,'muted'));for(const s of race.standings)line(c,s.name,s.score+' score / '+s.projectedPoints+' projected pts');for(const f of race.firsts)line(c,f.label,f.winner);}
 const help=card('ABOUT THIS FILE',main);help.classList.add('help');help.append(el('p','This is a portable browser recreation of the plugin UI, using the project’s sample fixtures and real rank emblems/item sprites. It works offline. No account, installation, or login is needed.','muted'));help.append(el('p','Live tracking, secure permissions, Discord notifications, and permanent audit logs run in the connected plugin and service. This preview does not connect to them or change any points or in-game ranks.','muted'));
}
const dropIds=[4151,11802,11804,20997,22481,27277,13652,12924],dropNames=['Abyssal whip','Armadyl godsword','Bandos godsword','Twisted bow','Sanguinesti staff (uncharged)',"Tumeken’s shadow (uncharged)",'Dragon claws','Toxic blowpipe (empty)'];
const petIds=[12650,12651,12652,12653,12654,12655,12646,12921],petNames=['Pet General Graardor','Pet Zilyana',"Pet K’ril Tsutsaroth",'Prince Black Dragon','Kalphite Princess','Pet Kraken','Baby Mole','Pet Snakeling'];
function awards(){const rows=[];for(const category of categories){const total=member.breakdown[category]||0;if(!total)continue;for(let i=0;i<8;i++){const item=['Drops','Collection','Pets'].includes(category),pet=category==='Pets';rows.push({category,title:item?(pet?petNames:dropNames)[i]:'Sample '+category+' award '+(i+1),itemId:item?(pet?petIds:dropIds)[i]:null,points:Math.trunc(total/8)+(i===0?total%8:0),at:'2026-10-'+String(25-i).padStart(2,'0')+' 12:00 UTC',occurrences:1});}}return rows;}
function openLog(category){$('source').value=category;$('search').value='';$('group').checked=false;$('sort').value='newest';$('log-title').textContent=member.name+'’s Points Log';page=1;renderLog();$('log').showModal();}
function renderLog(){let rows=awards().filter(e=>($('source').value==='All'||e.category===$('source').value)&&e.title.toLowerCase().includes($('search').value.toLowerCase()));if($('group').checked){const map=new Map();for(const e of rows){const key=e.category+'|'+e.title;if(map.has(key)){map.get(key).points+=e.points;map.get(key).occurrences++;}else map.set(key,{...e});}rows=[...map.values()];}rows.sort((a,b)=>$('sort').value==='highest'?b.points-a.points:$('sort').value==='oldest'?a.at.localeCompare(b.at):b.at.localeCompare(a.at));filtered=rows;const pages=Math.max(1,Math.ceil(rows.length/24));page=Math.min(page,pages);$('page').textContent='Page '+page+'/'+pages;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('totals').textContent=num(rows.length)+' entries | +'+num(rows.reduce((sum,e)=>sum+e.points,0))+' pts';$('awards').replaceChildren();for(const e of rows.slice((page-1)*24,page*24)){const c=card(null,$('awards'));c.classList.add('award');c.append(el('strong',e.title));if(e.itemId&&assets['items/'+e.itemId]){const i=el('img');i.src=assets['items/'+e.itemId];i.alt=e.title;c.append(i);}else c.append(el('span',e.category[0],'badge'));c.append(el('small',e.category+(e.occurrences>1?' ×'+e.occurrences:'')),el('strong','+'+num(e.points)+' pts','points'),el('small',e.at));}if(!rows.length)$('awards').append(el('p','No matching sample awards.','muted'));}
for(const name of tabs)$('nav').append(button(name,()=>show(name)));for(const name of ['All',...categories]){const o=el('option',name);o.value=name;$('source').append(o);}for(const id of ['source','sort','group'])$(id).onchange=()=>{page=1;renderLog();};$('search').oninput=()=>{page=1;renderLog();};$('prev').onclick=()=>{page--;renderLog();};$('next').onclick=()=>{page++;renderLog();};$('close-log').onclick=()=>$('log').close();$('logo').src=assets.logo;show('Profile');
</script></html>
