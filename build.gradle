plugins {
    id 'java'
}
repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex 'net\\.runelite.*' }
    }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}
group = 'com.traphouse'
version = '1.0.0'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.traphouse.TrapHousePluginLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

tasks.register('preview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.traphouse.TrapHousePanelPreview'
}

tasks.register('previewBoth', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.traphouse.TrapHouseBothTabsPreview'
}

tasks.register('previewClan', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.traphouse.TrapHouseClanPreview'
}

tasks.register('previewRewards', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.traphouse.RewardCatalogPreview'
    jvmArgs '-Djava.awt.headless=true'
}

// The ranking service is a separate process; JDBC and server classes never ship in the plugin JAR.
sourceSets {
    server { java.srcDir 'server/src/main/java'; resources.srcDir 'server/src/main/resources' }
    serverTest { java.srcDir 'server/src/test/java' }
}
dependencies {
    serverImplementation 'com.google.code.gson:gson:2.10.1'
    serverRuntimeOnly 'org.postgresql:postgresql:42.7.8'
    serverTestImplementation sourceSets.server.output
    serverTestImplementation 'com.google.code.gson:gson:2.10.1'
    serverTestImplementation 'junit:junit:4.13.2'
    serverTestRuntimeOnly 'org.postgresql:postgresql:42.7.8'
}
tasks.register('serverTest', Test) {
    testClassesDirs = sourceSets.serverTest.output.classesDirs
    classpath = sourceSets.serverTest.runtimeClasspath
    useJUnit()
    exclude '**/*PostgresTest.class'
}
tasks.register('serverIntegrationTest', Test) {
    testClassesDirs = sourceSets.serverTest.output.classesDirs
    classpath = sourceSets.serverTest.runtimeClasspath
    include '**/*PostgresTest.class'
    useJUnit()
    doFirst {
        if (!System.getenv('TRAP_TEST_DATABASE_URL')) {
            throw new GradleException('Set TRAP_TEST_DATABASE_URL, TRAP_TEST_DATABASE_USER, and TRAP_TEST_DATABASE_PASSWORD to a disposable PostgreSQL database.')
        }
    }
}
tasks.register('runServer', JavaExec) {
    classpath = sourceSets.server.runtimeClasspath
    mainClass = 'com.traphouse.server.RankingServer'
}
tasks.named('check') { dependsOn 'serverTest' }

// Local packaging checks; the official Hub build and review remain authoritative.
tasks.register('verifyPluginHub') {
    dependsOn tasks.named('jar')
    doLast {
        def metadata = new Properties()
        file('runelite-plugin.properties').withInputStream { metadata.load(it) }
        ['displayName', 'author', 'description', 'tags', 'plugins'].each {
            if (!metadata.getProperty(it)?.trim()) throw new GradleException("Missing Plugin Hub metadata: ${it}")
        }
        if (metadata.getProperty('build') != 'standard') throw new GradleException('Expected standard Plugin Hub build')
        if (!file('LICENSE').isFile()) throw new GradleException('Missing license')
        def icon = javax.imageio.ImageIO.read(file('icon.png'))
        if (icon == null || icon.width > 48 || icon.height > 72) throw new GradleException('Plugin Hub icon must be at most 48x72')
        def archive = new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
        try {
            metadata.getProperty('plugins').split(',').each {
                if (archive.getEntry(it.trim().replace('.', '/') + '.class') == null) throw new GradleException("Missing entry point: ${it}")
            }
            archive.entries().each { entry ->
                if (entry.name.startsWith('com/traphouse/server/') || entry.name.startsWith('org/postgresql/')) {
                    throw new GradleException("Backend code must not ship in the plugin: ${entry.name}")
                }
                if (entry.name.endsWith('.class')) {
                    archive.getInputStream(entry).withCloseable { input ->
                        def header = new DataInputStream(input)
                        if (header.readInt() != (int) 0xCAFEBABE) throw new GradleException('Invalid class header')
                        header.readUnsignedShort()
                        if (header.readUnsignedShort() > 55) throw new GradleException("Class requires newer than Java 11: ${entry.name}")
                    }
                }
            }
            ['icon.png', 'ranks/recruit.png', 'ranks/owner.png'].each {
                if (archive.getEntry('com/traphouse/' + it) == null) throw new GradleException("Missing bundled resource: ${it}")
            }
        } finally { archive.close() }
        logger.lifecycle('Local Plugin Hub packaging checks passed; official Hub CI/review is still required.')
    }
}

tasks.register('serverJar', Jar) {
    archiveClassifier = 'server'
    from sourceSets.server.output
}

tasks.register('serverDist', Sync) {
    dependsOn 'serverJar'
    into layout.buildDirectory.dir('server-dist')
    into('lib') {
        from tasks.named('serverJar')
        from configurations.serverRuntimeClasspath
    }
    into('bin') { from 'server/bin' }
}
